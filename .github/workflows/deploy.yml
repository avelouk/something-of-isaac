# Push to `main`: build + deploy to GitHub Pages at https://somethingofisaac.com/
# (custom domain via public/CNAME; DNS A records → GitHub Pages IPs).
#
# The old URL, avelouk.com/something-of-isaac/, is a static bridge page kept in the
# Quartz repo — it is no longer mirrored from here.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Optional: GitHub repo Variable VITE_STATS_WORKER_URL = https://<your-worker>.workers.dev
      - run: npm run build
        env:
          VITE_BASE: "/"
          VITE_STATS_WORKER_URL: ${{ vars.VITE_STATS_WORKER_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

